<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok Studio</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--bd:#2a2f3a;--tx:#e8eaf0;--mut:#8b92a5;--ac:#6ea8ff}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--bd:#d9dce4;--tx:#1b1e26;--mut:#667;--ac:#2b6cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:360px 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
textarea,input,select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{margin-top:14px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
#status{margin-top:10px;font-size:13px;color:var(--mut);white-space:pre-wrap}
#status.err{color:#ff6b6b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg)}
.item img,.item video{width:100%;display:block}
.item .m{padding:8px;font-size:12px;color:var(--mut)}
.item a{color:var(--ac)}
.item button{margin-left:6px;background:none;border:1px solid var(--ac);color:var(--ac);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
#extBox{display:none;margin-top:10px;padding:8px;border:1px dashed var(--ac);border-radius:8px;font-size:13px}
#extBox video{width:100%;margin-top:6px;border-radius:6px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:12px}
.pick{display:inline-block;padding:10px 14px;border:1px solid var(--ac);color:var(--ac);border-radius:8px;cursor:pointer;font-size:14px}
.pick input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#refClear{display:none;margin-left:8px;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
#spend{font-size:13px;color:var(--mut);margin:-4px 0 12px}
#spend b{color:var(--tx)}
#spend button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:12px}
#prev{max-width:100%;max-height:120px;margin-top:6px;border-radius:8px;display:none}
</style>
</head>
<body>
<main>
<section class="card">
  <h1>Grok Studio</h1>
  <div id="spend">Đã chi (ước tính): <b id="spendTotal">$0.00</b> · lần gần nhất <b id="spendLast">–</b> <button id="spendReset" type="button">Đặt lại</button></div>
  <div class="tabs"><button id="tImage" class="on">Ảnh</button><button id="tVideo">Video</button></div>
  <div id="extBox">Đang kéo dài video: <b id="extName"></b> <button id="extCancel" type="button">Huỷ</button><video id="extPrev" muted controls></video></div>
  <label>Prompt</label>
  <textarea id="prompt" placeholder="Mô tả thứ bạn muốn tạo..."></textarea>
  <label id="refLabel">Ảnh tham chiếu (tuỳ chọn: sửa ảnh / ảnh → video)</label>
  <label class="pick">📷 Chọn ảnh<input type="file" id="ref" accept="image/*"></label><button id="refClear" type="button">Bỏ ảnh</button>
  <img id="prev">
  <div class="row" id="imgOpts">
    <div><label>Số ảnh (1-10)</label><input id="n" type="number" min="1" max="10" value="1"></div>
    <div><label>Độ phân giải ảnh</label>
      <select id="resImg"><option value="">Mặc định</option><option>1k</option><option>2k</option></select></div>
  </div>
  <div class="row" id="vidOpts" style="display:none">
    <div><label>Thời lượng (giây)</label><input id="duration" type="number" min="1" max="15" value="8"></div>
    <div><label>Độ phân giải video</label>
      <select id="resVid"><option selected>480p</option><option>720p</option><option>1080p</option></select></div>
  </div>
  <div id="durHint" style="font-size:11px;color:var(--mut)">Video mới / kéo dài (rẻ): 1–15s. Kéo dài (mượt): 2–10s.</div>
  <div class="row">
  </div>
  <div class="row">
    <div><label>Tỉ lệ khung hình</label>
      <select id="ar"><option value="">Mặc định</option><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option></select></div>
  </div>
  <details><summary>Model</summary>
    <label>Model ảnh</label><input id="mImg" value="grok-imagine-image">
    <label>Model video</label><input id="mVid" value="grok-imagine-video-1.5-lite">
    <label>Model kéo dài video</label><input id="mExt" value="grok-imagine-video">
  </details>
  <button class="go" id="go">Tạo</button>
  <div id="status"></div>
</section>
<section class="card">
  <h1>Kết quả &amp; lịch sử</h1>
  <div class="grid" id="grid"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let mode='image',refData=null,extFile=null,extCheap=false;
function setExt(f,cheap){extFile=f;extCheap=!!cheap;$('extBox').style.display=f?'block':'none';
  $('extName').textContent=f?f+(extCheap?' (rẻ: khung cuối + 1.5-lite, rồi ghép)':' (mượt)'):'';
  for(const el of [$('refLabel'),document.querySelector('.pick')])el.style.display=f?'none':'';
  $('extPrev').src=f?'/outputs/'+f:'';if(f){setMode('video');$('prompt').value='';$('prompt').placeholder='Mô tả điều xảy ra tiếp theo...';$('duration').value=6;window.scrollTo({top:0,behavior:'smooth'})}
  else $('prompt').placeholder='Mô tả thứ bạn muốn tạo...'}
$('extCancel').onclick=()=>setExt(null);
function setMode(m){mode=m;$('tImage').classList.toggle('on',m=='image');$('tVideo').classList.toggle('on',m=='video');
  $('imgOpts').style.display=m=='image'?'':'none';$('vidOpts').style.display=m=='video'?'':'none';}
$('tImage').onclick=()=>setMode('image');$('tVideo').onclick=()=>setMode('video');
function clearRef(){refData=null;$('ref').value='';$('prev').style.display='none';$('refClear').style.display='none'}
$('refClear').onclick=clearRef;
// Re-encode to JPEG (max 2048px): handles iPhone HEIC photos and keeps uploads small.
$('ref').onchange=e=>{const f=e.target.files[0];if(!f)return clearRef();
  st('Đang đọc ảnh...');const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const s=Math.min(1,2048/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    refData=c.toDataURL('image/jpeg',0.9);URL.revokeObjectURL(url);
    $('prev').src=refData;$('prev').style.display='block';$('refClear').style.display='inline';st('')};
  img.onerror=()=>{URL.revokeObjectURL(url);clearRef();st('Không đọc được ảnh này, thử ảnh JPG/PNG khác.',1)};
  img.src=url};
function st(t,err){$('status').textContent=t;$('status').className=err?'err':''}
// Running spend estimate, kept per browser so it survives Render wiping the server's disk.
const money=c=>c==null?'?':'$'+c.toFixed(c<0.1?3:2);
function getSpend(){try{return +localStorage.getItem('spend')||0}catch(e){return 0}}
function setSpend(v){try{localStorage.setItem('spend',v)}catch(e){};$('spendTotal').textContent=money(v)}
function addSpend(c){$('spendLast').textContent=money(c);if(c!=null)setSpend(getSpend()+c)}
setSpend(getSpend());
$('spendReset').onclick=()=>{if(confirm('Đặt lại bộ đếm chi phí về 0?'))setSpend(0)};
function card(kind,prompt,file,cost){
  const d=document.createElement('div');d.className='item';
  const url='/outputs/'+file;
  d.innerHTML=(kind=='video'?`<video controls loop src="${url}"></video>`:`<img src="${url}" loading="lazy">`)+
   `<div class="m"></div>`;
  d.querySelector('.m').append((cost!=null?'~'+money(cost)+' · ':'')+prompt.slice(0,120)+' ',Object.assign(document.createElement('a'),{href:url,download:file,textContent:'Tải về'}));
  if(kind=='video')d.querySelector('.m').append(
    Object.assign(document.createElement('button'),{textContent:'Kéo dài (rẻ)',onclick:()=>setExt(file,true)}),
    Object.assign(document.createElement('button'),{textContent:'Kéo dài (mượt)',onclick:()=>setExt(file,false)}));
  return d}
function show(kind,prompt,files,cost){files.forEach((f,i)=>$('grid').prepend(card(kind,prompt,f,i?null:cost)))}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
$('go').onclick=async()=>{
  const prompt=$('prompt').value.trim();if(!prompt)return st('Nhập prompt trước.',1);
  $('go').disabled=true;st('Đang gửi...');
  const common={prompt,aspect_ratio:$('ar').value,image:refData};
  try{
    if(mode=='image'){
      const j=await post('/api/image',{...common,resolution:$('resImg').value,model:$('mImg').value,n:$('n').value});
      show('image',prompt,j.files,j.cost);addSpend(j.cost);st('Xong. Ước tính '+money(j.cost));
    }else{
      const model=extFile&&!extCheap?$('mExt').value:$('mVid').value;
      const duration=$('duration').value,resolution=$('resVid').value;
      const s=!extFile?await post('/api/video',{...common,model,duration,resolution})
             :extCheap?await post('/api/video/extend-cheap',{prompt,model,file:extFile,duration,resolution})
             :await post('/api/video/extend',{prompt,model,file:extFile,duration});
      if(!s.request_id)throw new Error('Không có request_id: '+JSON.stringify(s.raw));
      const t0=Date.now();
      while(true){
        await new Promise(r=>setTimeout(r,5000));
        st(`Đang tạo video... ${Math.round((Date.now()-t0)/1000)}s`);
        const r=await fetch(`/api/video/${s.request_id}?prompt=${encodeURIComponent(prompt)}&model=${encodeURIComponent(model)}`);
        const j=await r.json();if(!r.ok)throw new Error(j.error);
        if(j.status=='done'){show('video',prompt,j.files,j.cost);addSpend(j.cost);st('Xong. Ước tính '+money(j.cost));setExt(null);break}
        if(j.error)throw new Error('Video '+j.status+': '+j.error);
      }
    }
  }catch(e){st(e.message,1)}
  $('go').disabled=false};
fetch('/api/history').then(r=>r.json()).then(h=>h.slice().reverse().forEach(i=>show(i.kind,i.prompt,i.files,i.cost)));
</script>
</body>
</html>
